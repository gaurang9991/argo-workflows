[request_definition]
r = sub, res, act, obj

[policy_definition]
p = sub, res, act, obj, eft

[role_definition]
g = _, _

[policy_effect]
e = some(where (p.eft == allow)) && !some(where (p.eft == deny))

# res and act match "*" or an exact string only (no "|" alternation or globbing: write one
# policy line per action, e.g. separate "resume" and "retry" lines, not "resume|retry").
# obj matches via keyMatch, which supports a trailing "*" wildcard (e.g. "team-a/*").
[matchers]
m = g(r.sub, p.sub) && (p.res == "*" || r.res == p.res) && (p.act == "*" || r.act == p.act) && keyMatch(r.obj, p.obj)
